<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GSAP Canvas Image Interaction</title>

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #161616;
      color: #fff;
      font-family: "Red Rose", sans-serif;
      overflow-x: hidden;
    }

    /* =========================================
       MAIN
    ========================================= */

    main {
      width: 100%;
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 80px 40px;
    }

    /* =========================================
       CARDS
    ========================================= */

    .cards {
      width: 100%;

      display: flex;
      flex-wrap: wrap;

      justify-content: center;
      align-items: center;
    }

    .card {
      position: relative;

      width: 260px;
      height: 360px;

      margin: 32px 64px;
    }

    /* =========================================
       IMAGE
    ========================================= */

    .card__image {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;
    }

    .card__image--inner {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;
    }

    .card__image--inner canvas {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: block;

      transform: scale(1.02);
    }

    /* =========================================
       CARD TEXT
    ========================================= */

    .card__text {
      position: absolute;

      left: 0;
      bottom: 25%;

      transform: translateX(-50%);

      pointer-events: none;
      user-select: none;

      overflow: hidden;

      z-index: 5;
    }

    .card__text--inner {
      display: inline-block;

      color: #fff;

      font-size: 3rem;
      line-height: 1;

      font-family: "Red Rose", sans-serif;
      font-weight: 700;

      white-space: nowrap;
    }

    /* =========================================
       LOADER
    ========================================= */

    .loading__wrapper {
      position: fixed;

      left: 0;
      top: 0;

      width: 100%;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #000;

      z-index: 200;

      transition:
        opacity 500ms ease-in,
        visibility 500ms ease-in;
    }

    .loading__wrapper.hide {
      opacity: 0;
      visibility: hidden;

      pointer-events: none;
      user-select: none;
    }

    .loader__text {
      color: #fff;

      font-family: "Red Rose", sans-serif;
      font-size: 16px;
      font-weight: 400;

      letter-spacing: 0.04em;
    }

    /* =========================================
       SUPPORT
    ========================================= */

    .support {
      position: fixed;

      right: 20px;
      bottom: 20px;

      z-index: 20;
    }

    .support a {
      color: #fff;

      text-decoration: none;

      font-size: 13px;

      opacity: 0.5;

      transition: opacity 200ms ease;
    }

    .support a:hover {
      opacity: 1;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 768px) {
      main {
        padding: 50px 20px;
      }

      .card {
        width: min(260px, 80vw);
        height: min(360px, 110vw);

        margin: 40px 20px;
      }

      .card__text--inner {
        font-size: 2.4rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       MAIN
  ========================================= -->

  <main>
    <div class="cards">

      <!-- CARD 1 -->
      <div class="card">

        <div class="card__image">
          <div class="card__image--inner"></div>
        </div>

        <div class="card__text">
          <span class="card__text--inner">
            DESERT
          </span>
        </div>

      </div>


      <!-- CARD 2 -->
      <div class="card">

        <div class="card__image">
          <div class="card__image--inner"></div>
        </div>

        <div class="card__text">
          <span class="card__text--inner">
            FOREST
          </span>
        </div>

      </div>


      <!-- CARD 3 -->
      <div class="card">

        <div class="card__image">
          <div class="card__image--inner"></div>
        </div>

        <div class="card__text">
          <span class="card__text--inner">
            OCEAN
          </span>
        </div>

      </div>

    </div>
  </main>


  <!-- =========================================
       LOADING SCREEN
  ========================================= -->

  <div class="loading__wrapper">

    <div class="loader__text">
      Loading...
    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    /* =========================================
       CARD ELEMENTS
    ========================================= */

    const cards = Array.from(
      document.querySelectorAll(".card")
    );


    /* =========================================
       IMAGE CONFIGURATION
    ========================================= */

    const cardOptions = [

      {
        imageURL: {
          default:
            "https://raw.githubusercontent.com/devloop01/canvas-image-interaction/master/src/images/desert-dark.jpg",

          hovered:
            "https://raw.githubusercontent.com/devloop01/canvas-image-interaction/master/src/images/desert-bright.jpg"
        },

        totalParticles: 1500,

        mouseRange: 80,

        particlesConfig: {
          jumpToRandomPosition: false,
          fill: true,
          randomRadius: true,
          minRadius: 1,
          maxRadius: 2
        }
      },


      {
        imageURL: {
          default:
            "https://raw.githubusercontent.com/devloop01/canvas-image-interaction/master/src/images/forest.jpg",

          hovered:
            "https://raw.githubusercontent.com/devloop01/canvas-image-interaction/master/src/images/forest-top.jpg"
        },

        totalParticles: 2500,

        mouseRange: 80,

        particlesConfig: {
          jumpToRandomPosition: true,
          fill: true,
          shape: "square",
          radius: 2
        }
      },


      {
        imageURL: {
          default:
            "https://raw.githubusercontent.com/devloop01/canvas-image-interaction/master/src/images/ocean-top.jpg",

          hovered:
            "https://raw.githubusercontent.com/devloop01/canvas-image-interaction/master/src/images/ocean.jpg"
        },

        totalParticles: 2500,

        mouseRange: 80,

        particlesConfig: {
          jumpToRandomPosition: false,
          bounceFromEdges: false,
          fill: false,
          shape: "hexagon",
          radius: 1
        }
      }

    ];


    /* =========================================
       GET ALL IMAGE URLS
    ========================================= */

    const imageURLs = cardOptions
      .map(option => Object.values(option.imageURL))
      .flat();


    /* =========================================
       CANVAS CLASS
    ========================================= */

    class Canvas {

      constructor(options = {}) {

        this.parent = options.parent;

        this.dimensions = options.dimensions;

        this.imageURL = options.imageURL || {};

        this.images = options.images || {};

        this.imagesData = {
          default: null,
          hovered: null
        };

        this.currentImageData = null;

        this.particles = null;

        this.totalParticles =
          options.totalParticles || 400;

        this.hovered = false;

        this.particlesConfig =
          options.particlesConfig || {};

        this.mouseRange =
          options.mouseRange || null;

        this.mouse = null;

        this.init();
      }


      /* =========================================
         INIT CANVAS
      ========================================= */

      init() {

        this.canvas =
          document.createElement("canvas");

        this.ctx =
          this.canvas.getContext("2d");

        this.canvas.width =
          this.dimensions.width;

        this.canvas.height =
          this.dimensions.height;


        /*
         * We already loaded the images,
         * so process them directly.
         */

        this.imagesData.default =
          returnImageData(
            this.images.default,
            this.dimensions
          );


        this.imagesData.hovered =
          returnImageData(
            this.images.hovered,
            this.dimensions
          );


        this.currentImageData =
          this.imagesData.default;


        this.addParticles(
          this.totalParticles
        );


        this.startRender();

        this.initEvents();


        this.parent.appendChild(
          this.canvas
        );


        /* =====================================
           MOUSE PARTICLE
        ===================================== */

        if (this.mouseRange !== null) {

          this.mouse =
            new Particle({

              ctx: this.ctx,

              position: {
                x: 0,
                y: 0
              },

              radius: this.mouseRange,

              color: "#000",

              avoidEdges: true,

              shape: "circle"
            });
        }

      }


      /* =========================================
         EVENTS
      ========================================= */

      initEvents() {

        const onMouseEnter = () => {

          this.hovered = true;

          this.currentImageData =
            this.imagesData.hovered;
        };


        const onMouseLeave = () => {

          this.hovered = false;

          this.currentImageData =
            this.imagesData.default;
        };


        const onMouseMove = (e) => {

          if (
            this.mouse !== null &&
            this.hovered
          ) {

            this.mouse.position.x =
              e.offsetX;

            this.mouse.position.y =
              e.offsetY;
          }
        };


        this.canvas.addEventListener(
          "mouseenter",
          onMouseEnter
        );


        this.canvas.addEventListener(
          "mouseleave",
          onMouseLeave
        );


        this.canvas.addEventListener(
          "mousemove",
          onMouseMove
        );

      }


      /* =========================================
         CREATE PARTICLES
      ========================================= */

      addParticles(total) {

        this.particles =
          new Particles({

            ctx: this.ctx,

            totalParticles: total,

            maxBounds: {
              width:
                this.dimensions.width,

              height:
                this.dimensions.height
            },

            imageData:
              this.currentImageData,

            particlesConfig:
              this.particlesConfig

          });
      }


      /* =========================================
         UPDATE PARTICLE COLOR
      ========================================= */

      updateParticleColor(
        imageData,
        particle
      ) {

        const color =
          returnPixelColor(
            imageData,

            Math.floor(
              this.dimensions.width
            ),

            {
              x: Math.floor(
                particle.position.x
              ),

              y: Math.floor(
                particle.position.y
              )
            }
          );


        particle.updateColor(
          color
        );
      }


      /* =========================================
         RENDER LOOP
      ========================================= */

      startRender() {

        requestAnimationFrame(
          () => this.render()
        );
      }


      render() {

        this.particles.particles
          .forEach(particle => {

            if (
              this.mouseRange !== null
            ) {

              const distance =
                dist(
                  this.mouse.position,
                  particle.position
                );


              if (
                distance <
                  this.mouse.radius +
                  particle.radius &&
                this.hovered
              ) {

                this.updateParticleColor(
                  this.imagesData.hovered,
                  particle
                );

              } else {

                this.updateParticleColor(
                  this.imagesData.default,
                  particle
                );

              }

            } else {

              this.updateParticleColor(
                this.currentImageData,
                particle
              );
            }

          });


        this.particles.update();


        requestAnimationFrame(
          () => this.render()
        );

      }

    }


    /* =========================================
       PARTICLES CLASS
    ========================================= */

    class Particles {

      constructor(options = {}) {

        this.ctx =
          options.ctx;

        this.totalParticles =
          options.totalParticles;

        this.maxBounds =
          options.maxBounds;

        this.imageData =
          options.imageData;

        this.particles = [];


        const config =
          options.particlesConfig || {};


        this.particlesConfig = {

          jumpToRandomPosition:
            config.jumpToRandomPosition ??
            false,

          growAndShrink:
            config.growAndShrink ??
            false,

          fill:
            config.fill ??
            true,

          bounceFromEdges:
            config.bounceFromEdges ??
            true,

          shape:
            config.shape ??
            "circle",

          radius:
            config.radius ??
            5,

          randomRadius:
            config.randomRadius ??
            false,

          maxRadius:
            config.maxRadius ??
            5,

          minRadius:
            config.minRadius ??
            2,

          maxVelocity:
            config.maxVelocity ??
            8
        };


        this.init();
      }


      /* =========================================
         CREATE PARTICLES
      ========================================= */

      init() {

        for (
          let i = 0;
          i < this.totalParticles;
          i++
        ) {

          const radius =
            this.particlesConfig.randomRadius

              ? randomIntegerFromRange(
                  this.particlesConfig.minRadius,
                  this.particlesConfig.maxRadius
                )

              : this.particlesConfig.radius;


          const position = {

            x: randomIntegerFromRange(
              radius,
              this.maxBounds.width -
              radius
            ),

            y: randomIntegerFromRange(
              radius,
              this.maxBounds.height -
              radius
            )

          };


          this.particles.push(

            new Particle({

              ctx: this.ctx,

              position,

              radius,

              color: "transparent",

              imageData: this.imageData,

              maxVelocity:
                this.particlesConfig.maxVelocity,

              bounceFromEdges:
                this.particlesConfig.bounceFromEdges,

              shape:
                this.particlesConfig.shape,

              edges: {
                width:
                  this.maxBounds.width,

                height:
                  this.maxBounds.height
              }

            })

          );

        }

      }


      /* =========================================
         UPDATE PARTICLES
      ========================================= */

      update() {

        this.particles.forEach(
          particle => {

            particle.draw();


            if (
              this.particlesConfig.fill
            ) {

              particle.fillShape();

            } else {

              particle.strokeShape();

            }


            particle.update();


            if (
              this.particlesConfig.growAndShrink
            ) {

              particle.growAndShrink(
                particle.minRadius * 0.65
              );

            }


            if (
              !this.particlesConfig
                .jumpToRandomPosition
            ) {

              particle.updatePosition();

            } else {

              particle.jumpToRandomPosition({

                width:
                  this.maxBounds.width,

                height:
                  this.maxBounds.height

              });

            }

          }
        );

      }

    }


    /* =========================================
       PARTICLE CLASS
    ========================================= */

    class Particle {

      constructor(options = {}) {

        this.ctx =
          options.ctx;


        this.position =
          options.position || {
            x: 0,
            y: 0
          };


        this.maxVelocity =
          options.maxVelocity || 5;


        this.velocity =
          options.velocity || {

            x:
              (0.5 - Math.random()) *
              this.maxVelocity,

            y:
              (0.5 - Math.random()) *
              this.maxVelocity

          };


        this.radius =
          options.radius;


        this.minRadius =
          this.radius;


        this.color =
          options.color;


        this.imageData =
          options.imageData;


        this.rotation = 0;


        this.rotationIncrement =
          randomIntegerFromRange(
            2,
            5
          );


        this.edges =
          options.edges || null;


        this.bounceFromEdges =
          options.bounceFromEdges;


        this.avoidEdges =
          options.avoidEdges ||
          false;


        this.tick = 0;


        this.tickIncrement =
          0.02 +
          Math.random() * 0.03;

      }


      /* =========================================
         DRAW
      ========================================= */

      draw() {

        this.ctx.beginPath();

        this.ctx.save();


        this.ctx.translate(
          this.position.x,
          this.position.y
        );


        this.ctx.rotate(
          (Math.PI / 180) *
          this.rotation
        );


        this.drawShape(
          this.shape
        );


        this.ctx.restore();

        this.ctx.closePath();

      }


      /* =========================================
         FILL
      ========================================= */

      fillShape() {

        this.ctx.fillStyle =
          this.color;

        this.ctx.fill();

      }


      /* =========================================
         STROKE
      ========================================= */

      strokeShape() {

        this.ctx.strokeStyle =
          this.color;

        this.ctx.stroke();

      }


      /* =========================================
         DRAW SHAPE
      ========================================= */

      drawShape(shape) {

        if (
          shape === "square"
        ) {

          this.ctx.rect(

            -this.radius / 2,

            -this.radius / 2,

            this.radius,

            this.radius

          );

        }

        else if (
          shape === "hexagon"
        ) {

          this.ctx.moveTo(

            this.radius *
              Math.cos(0),

            this.radius *
              Math.sin(0)

          );


          for (
            let side = 0;
            side < 7;
            side++
          ) {

            this.ctx.lineTo(

              this.radius *
                Math.cos(
                  side *
                  2 *
                  Math.PI /
                  6
                ),

              this.radius *
                Math.sin(
                  side *
                  2 *
                  Math.PI /
                  6
                )

            );

          }

        }

        else {

          this.ctx.arc(

            0,
            0,

            this.radius,

            0,
            Math.PI * 2

          );

        }

      }


      /* =========================================
         UPDATE
      ========================================= */

      update() {

        if (
          this.bounceFromEdges
        ) {

          this.changeVelocityOnBounce();

        } else {

          this.continueFromEdge();

        }


        this.rotation +=
          this.rotationIncrement;


        this.tick +=
          this.tickIncrement;

      }


      /* =========================================
         POSITION
      ========================================= */

      updatePosition() {

        this.position.x +=
          this.velocity.x;

        this.position.y +=
          this.velocity.y;

      }


      /* =========================================
         RANDOM POSITION
      ========================================= */

      jumpToRandomPosition(bounds) {

        this.position.x =
          Math.random() *
          bounds.width;

        this.position.y =
          Math.random() *
          bounds.height;

      }


      /* =========================================
         GROW / SHRINK
      ========================================= */

      growAndShrink(max) {

        this.radius =
          this.minRadius +
          Math.abs(
            Math.sin(this.tick)
          ) * max;

      }


      /* =========================================
         COLOR
      ========================================= */

      updateColor(color) {

        this.color = color;

      }


      /* =========================================
         CONTINUE FROM EDGE
      ========================================= */

      continueFromEdge() {

        if (
          !this.avoidEdges
        ) {

          if (
            this.position.x >
            this.edges.width
          ) {

            this.position.x = 0;

          }

          else if (
            this.position.x < 0
          ) {

            this.position.x =
              this.edges.width;

          }


          if (
            this.position.y >
            this.edges.height
          ) {

            this.position.y = 0;

          }

          else if (
            this.position.y < 0
          ) {

            this.position.y =
              this.edges.height;

          }

        }

      }


      /* =========================================
         BOUNCE
      ========================================= */

      changeVelocityOnBounce() {

        if (
          !this.avoidEdges
        ) {

          if (
            this.position.x +
              this.radius >
              this.edges.width ||

            this.position.x -
              this.radius <
              0
          ) {

            this.velocity.x *= -1;

          }


          if (
            this.position.y +
              this.radius >
              this.edges.height ||

            this.position.y -
              this.radius <
              0
          ) {

            this.velocity.y *= -1;

          }

        }

      }

    }


    /* =========================================
       UTILITY FUNCTIONS
    ========================================= */

    function randomIntegerFromRange(
      min,
      max
    ) {

      return Math.floor(
        Math.random() *
        (max - min + 1) +
        min
      );

    }


    function dist(a, b) {

      return Math.sqrt(

        Math.pow(
          a.x - b.x,
          2
        ) +

        Math.pow(
          a.y - b.y,
          2
        )

      );

    }


    /* =========================================
       IMAGE -> PIXEL DATA
    ========================================= */

    function returnImageData(
      image,
      dimensions
    ) {

      const imageCanvas =
        document.createElement(
          "canvas"
        );


      const imageCanvasCtx =
        imageCanvas.getContext(
          "2d"
        );


      imageCanvas.width =
        dimensions.width;

      imageCanvas.height =
        dimensions.height;


      imageCanvasCtx.drawImage(

        image,

        0,
        0,

        imageCanvas.width,
        imageCanvas.height

      );


      return imageCanvasCtx.getImageData(

        0,
        0,

        imageCanvas.width,
        imageCanvas.height

      );

    }


    /* =========================================
       LOAD IMAGE
    ========================================= */

    function loadImage(
      url
    ) {

      return new Promise(
        (resolve, reject) => {

          const img =
            new Image();


          img.crossOrigin =
            "anonymous";


          img.onload = () => {

            resolve(img);

          };


          img.onerror = () => {

            reject(
              new Error(
                "Could not load image: " +
                url
              )
            );

          };


          img.src = url;

        }
      );

    }


    /* =========================================
       LOAD ALL IMAGES
    ========================================= */

    async function loadImages(
      urls
    ) {

      const loadedImages = [];

      for (
        const url of urls
      ) {

        const image =
          await loadImage(url);

        loadedImages.push(image);

      }

      return loadedImages;

    }


    /* =========================================
       PIXEL COLOR
    ========================================= */

    function returnPixelColor(
      imageData,
      width,
      position
    ) {

      let x =
        Math.max(
          0,
          Math.min(
            width - 1,
            position.x
          )
        );


      let y =
        Math.max(
          0,
          Math.min(
            imageData.height - 1,
            position.y
          )
        );


      const index =
        (x + y * width) * 4;


      const r =
        imageData.data[index];


      const g =
        imageData.data[index + 1];


      const b =
        imageData.data[index + 2];


      return `rgb(${r}, ${g}, ${b})`;

    }


    /* =========================================
       APP
    ========================================= */

    class App {

      async init() {

        try {

          /*
           * Wait until every image is loaded.
           */

          const images =
            await loadImages(
              imageURLs
            );


          /*
           * Split:
           *
           * [
           *   desert default,
           *   desert hover,
           *   forest default,
           *   forest hover,
           *   ocean default,
           *   ocean hover
           * ]
           */

          const splitImages =
            splitArray(
              images,
              2
            );


          /* =====================================
             CREATE CANVAS FOR EACH CARD
          ===================================== */

          cards.forEach(
            (card, index) => {

              const rect =
                card.getBoundingClientRect();


              new Canvas({

                parent:
                  card.querySelector(
                    ".card__image--inner"
                  ),

                dimensions: {

                  width:
                    Math.floor(
                      rect.width
                    ),

                  height:
                    Math.floor(
                      rect.height
                    )

                },

                ...cardOptions[index],

                images: {

                  default:
                    splitImages[index][0],

                  hovered:
                    splitImages[index][1]

                }

              });

            }
          );


          /* =====================================
             HIDE LOADER
          ===================================== */

          document
            .querySelector(
              ".loading__wrapper"
            )
            .classList.add(
              "hide"
            );


          /* =====================================
             GSAP ANIMATION
          ===================================== */

          createGSAPAnimation();


        } catch (error) {

          console.error(
            "Image loading error:",
            error
          );


          document
            .querySelector(
              ".loader__text"
            )
            .textContent =
              "Unable to load images.";

        }

      }

    }


    /* =========================================
       SPLIT ARRAY
    ========================================= */

    function splitArray(
      array,
      size
    ) {

      const result = [];


      for (
        let i = 0;
        i < array.length;
        i += size
      ) {

        result.push(
          array.slice(
            i,
            i + size
          )
        );

      }


      return result;

    }


    /* =========================================
       GSAP INTRO ANIMATION
    ========================================= */

    function createGSAPAnimation() {

      const imageWrappers =
        cards.map(
          card =>
            card.querySelector(
              ".card__image"
            )
        );


      const imageInner =
        cards.map(
          card =>
            card.querySelector(
              ".card__image--inner"
            )
        );


      const textInner =
        cards.map(
          card =>
            card.querySelector(
              ".card__text--inner"
            )
        );


      gsap.timeline({

        delay: 0.8,

        defaults: {

          duration: 1.5,

          stagger: 0.1,

          ease: "expo.out"

        }

      })

      /* -----------------------------------------
         IMAGE COMES DOWN
      ----------------------------------------- */

      .fromTo(

        imageWrappers,

        {
          yPercent: -100
        },

        {
          yPercent: 0
        }

      )


      /* -----------------------------------------
         IMAGE PARTICLES COME UP
      ----------------------------------------- */

      .fromTo(

        imageInner,

        {
          yPercent: 100
        },

        {
          yPercent: 0
        },

        0

      )


      /* -----------------------------------------
         TEXT COMES UP
      ----------------------------------------- */

      .fromTo(

        textInner,

        {
          yPercent: 100
        },

        {
          duration: 1.2,

          yPercent: 0

        },

        0.4

      );

    }


    /* =========================================
       START APP
    ========================================= */

    const app =
      new App();

    app.init();

  </script>
